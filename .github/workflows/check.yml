name: Check Crate Swipe
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --check app.js && node --check core.js && node --check session.js && node --check video-availability.js && node --check catalogue-client.js && node --check config.js && node --check playlist.js && node --check share.js && node --check scripts/serve.mjs
      - run: node --test tests/*.test.js
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit
      - name: Start local preview and run browser checks
        run: |
          node scripts/serve.mjs > /tmp/crate-preview.log 2>&1 &
          node --input-type=module -e 'for(let i=0;i<40;i++){try{if((await fetch("http://127.0.0.1:4173/")).ok)process.exit(0)}catch{}await new Promise(r=>setTimeout(r,250))}process.exit(1)'
          pnpm test:browser
          BROWSER=webkit pnpm test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-checks
          path: test-results/
